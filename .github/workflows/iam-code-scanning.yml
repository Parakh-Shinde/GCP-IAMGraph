name: GCP IAM Security Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  iam-security-scan:
    name: Analyze IAM attack paths
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install GCP IAMGraph
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Generate SARIF report
        run: |
          gcp-iamgraph \
            examples/vulnerable-environment.json \
            --format sarif \
            --output iam-findings.sarif

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@v4
        with:
          name: gcp-iamgraph-sarif
          path: iam-findings.sarif
          retention-days: 14

      - name: Upload findings to Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: iam-findings.sarif
          category: gcp-iamgraph
          wait-for-processing: true