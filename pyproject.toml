[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gcp-iamgraph"
version = "0.1.0"
description = "Explainable GCP IAM attack-path and least-privilege analyzer"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Parakh Shinde"}]
keywords = ["gcp", "iam", "cloud-security", "attack-path", "least-privilege"]

[project.scripts]
gcp-iamgraph = "gcp_iamgraph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

