[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gcp-iamgraph"
version = "0.1.1"
description = "Explainable GCP IAM attack-path and least-privilege analyzer"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Parakh Shinde"},
]
keywords = [
    "gcp",
    "iam",
    "cloud-security",
    "attack-path",
    "least-privilege",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/Parakh-Shinde/GCP-IAMGraph"
Repository = "https://github.com/Parakh-Shinde/GCP-IAMGraph"
Issues = "https://github.com/Parakh-Shinde/GCP-IAMGraph/issues"
Documentation = "https://github.com/Parakh-Shinde/GCP-IAMGraph#readme"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
]

[project.scripts]
gcp-iamgraph = "gcp_iamgraph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["gcp_iamgraph"]

[tool.coverage.report]
show_missing = true
skip_covered = true